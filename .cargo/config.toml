# Android target linker flags.
# 16 KB page alignment is required for Android 15+ devices with 16 KB pages.
# Cargo discovers this file by walking up from the working directory, so the Android
# build must run from core/ (cargo-ndk needs the workspace root as its working directory).
[target.aarch64-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
    "-C", "link-arg=-Wl,-z,common-page-size=16384",
]

[target.x86_64-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
    "-C", "link-arg=-Wl,-z,common-page-size=16384",
]
